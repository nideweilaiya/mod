plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.6'
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: '1.20.4'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'aicompanion'

            args '--nogui'
            mods {
                aicompanion {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'aicompanion'

            args '--nogui'
            mods {
                aicompanion {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs 'src/main/resources'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.0.30'
    implementation 'com.mojang:authlib:6.0.52'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'aicompanion',
            'Specification-Vendor'    : 'AIWorkbench',
            'Specification-Version'   : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'AIWorkbench',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}
